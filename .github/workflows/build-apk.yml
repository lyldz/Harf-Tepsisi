name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/
          cp logo.png android/app/src/main/assets/ 2>/dev/null || true
          cp icon*.png android/app/src/main/assets/ 2>/dev/null || true

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}"
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/HarfTepsisi-OmerAsaf-${TAG}.apk \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/HarfTepsisi-OmerAsaf.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarfTepsisi-OmerAsaf-APK
          path: build-output/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          files: build-output/*.apk
          name: "Harf Tepsisi ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🧺 Harf Tepsisi - Ömer Asaf Okuma Arkadaşı
            - **Sürüm:** `${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}`
            - **Paket:** `com.omerasaf.harftepsisi`
            
            ### 🚀 Yenilikler ve Değişiklikler (v1.0.5)
            - 🔤 **MEB 2024 Müfredatının Sıradaki 6 Yeni Harfi Eklendi:**
              - **K, U, R, I, M, Ü** harfleri, doğru Türkçe hecelemeleri ve sesli okuma altyapısıyla sisteme entegre edildi.
              - Tepside varsayılan olarak **O** harfine kadar olan küme korunurken (`A, N, E, T, İ, L, O`), istenildiğinde tek dokunuşla yeni harfler aktifleştirilebilir.
              - Yeni harflere özel çalışma yaprağı cümle piramitleri (Kek, Kale, Okul, Kutu, Kartal, Tarak, Ilık, Tatlı, Elma, Kalem, Ütü, Tünel) eklendi.
            - 🎨 **Yeni Modern Logo & Uygulama Simgesi (İkon):**
              - Sevimli 3D ahşap harf tepsisi, altın yıldız kupa ve renkli harf bloklarından oluşan yüksek çözünürlüklü yeni tasarım.
              - Android kare ve yuvarlak launcher simgeleri güncellendi.
            - 📲 **Uygulama İçi Canlı Güncelleme Sistemi (Tam Vakti Deneyimi):**
              - Her açılışta arka planda otomatik sürüm kontrolü.
              - Yeni sürüm çıktığında eğlenceli **"🎉 MÜJDE ÖMER ASAF!"** güncelleme penceresi.
              - Uygulama içinden canlı yüzde çubuğuyla (%0 - %100) APK indirme ve Android paket yükleyicisiyle tek tıkla kurulum!
