plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omerasaf.harftepsisi'
    compileSdk 34

    defaultConfig {
        applicationId "com.omerasaf.harftepsisi"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.0.4"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native Android WebView
}
